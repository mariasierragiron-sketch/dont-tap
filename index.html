<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Don't Tap - El juego más adictivo">
    <title>Don't Tap</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        
        .game {
            text-align: center;
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255,107,107,0.5);
            max-width: 400px;
        }
        
        h1 {
            color: #FF6B6B;
            font-size: 2.5em;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255,107,107,0.5);
        }
        
        .subtitle {
            color: #aaa;
            font-size: 0.9em;
            margin-bottom: 30px;
        }
        
        .score {
            font-size: 3em;
            color: #FFD700;
            margin: 20px 0;
            font-weight: bold;
        }
        
        .best {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        
        .message {
            font-size: 1.5em;
            color: #FF6B6B;
            margin: 20px 0;
            height: 40px;
            font-weight: bold;
        }
        
        button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #FF6B6B;
            background: linear-gradient(135deg, #FF6B6B, #FF5252);
            color: white;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            box-shadow: 0 0 20px rgba(255,107,107,0.5);
            transition: all 0.1s;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .controls {
            margin-top: 20px;
        }
        
        .restart, .share {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1em;
            color: white;
            font-weight: bold;
            display: none;
        }
        
        .restart {
            background: #4CAF50;
        }
        
        .share {
            background: #2196F3;
        }
        
        .show {
            display: inline-block !important;
        }
    </style>
</head>
<body>
    <div class="game">
        <h1>🔥 Don't Tap 🔥</h1>
        <p class="subtitle">¿Cuánto aguantas sin tocar?</p>
        
        <div class="score" id="score">0</div>
        <div class="best">Mejor: <span id="best">0</span></div>
        
        <div class="message" id="msg">¡Toca para empezar!</div>
        
        <button id="btn" onclick="tap()">TAP</button>
        
        <div class="controls">
            <button class="restart" id="restart" onclick="reset()">🔄 Otra vez</button>
            <button class="share" id="share" onclick="compartir()">Compartir 🔥</button>
        </div>
    </div>

    <script>
        let puntos = 0;
        let mejor = localStorage.getItem('mejor') || 0;
        let jugando = false;
        let espera = null;

        document.getElementById('best').textContent = mejor;

        function beep() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        function vibra() {
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function tap() {
            if (!jugando) {
                empezar();
            } else {
                perder();
            }
        }

        function empezar() {
            jugando = true;
            puntos = 0;
            document.getElementById('score').textContent = puntos;
            document.getElementById('msg').textContent = "¡No toques! 😈";
            document.getElementById('btn').textContent = "NO TOQUES";
            document.getElementById('restart').classList.remove('show');
            document.getElementById('share').classList.remove('show');
            proxPunto();
        }

        function proxPunto() {
            if (!jugando) return;
            
            clearTimeout(espera);
            let tiempo = Math.random() * 4000 + 1000;
            
            espera = setTimeout(function() {
                if (jugando) {
                    puntos++;
                    document.getElementById('score').textContent = puntos;
                    beep();
                    vibra();
                    
                    if (puntos == 1) document.getElementById('msg').textContent = "Punto 1 🎯";
                    else if (puntos == 5) document.getElementById('msg').textContent = "¡Vamos! 🔥";
                    else if (puntos == 10) document.getElementById('msg').textContent = "¡Increíble! 🚀";
                    else if (puntos == 20) document.getElementById('msg').textContent = "¡Leyenda! 👑";
                    else document.getElementById('msg').textContent = "¡Sigue! " + puntos;
                    
                    proxPunto();
                }
            }, tiempo);
        }

        function perder() {
            jugando = false;
            clearTimeout(espera);
            
            if (puntos > mejor) {
                mejor = puntos;
                localStorage.setItem('mejor', mejor);
                document.getElementById('best').textContent = mejor;
                document.getElementById('msg').textContent = "¡NUEVO RÉCORD! 🏆";
            } else {
                document.getElementById('msg').textContent = "Game Over 😭";
            }
            
            document.getElementById('btn').textContent = "PERDISTE";
            document.getElementById('restart').classList.add('show');
            document.getElementById('share').classList.add('show');
        }

        function reset() {
            document.getElementById('msg').textContent = "¡Toca para empezar!";
            document.getElementById('btn').textContent = "TAP";
            document.getElementById('score').textContent = "0";
            document.getElementById('restart').classList.remove('show');
            document.getElementById('share').classList.remove('show');
        }

        function compartir() {
            let texto = "He conseguido " + puntos + " puntos en Don't Tap 😈 ¿me superas?";
            if (navigator.share) {
                navigator.share({ title: "Don't Tap", text: texto, url: window.location.href });
            } else {
                alert(texto);
            }
        }
    </script>
</body>
</html>
